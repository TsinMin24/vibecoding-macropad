# ZMK Configuration for Nice Nano
# Dual-mode support: USB + BLE

# USB HID support
CONFIG_ZMK_USB=y

# BLE (Bluetooth Low Energy) support
CONFIG_ZMK_BLE=y
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_BONDS=5

# USB device stack
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_HID=y

# Sleep configuration (power saving)
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# Split keyboard support (required for Nice Nano)
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL=y
