# ZMK Build Configuration
# nice!nano 2x5 Vibe Coding Macropad（直连模式）
# 注意：nice_nano = v1 板，nice_nano_v2 = v2 板

include:
  - board: nice_nano
    artifact-name: nice_nano-v1
  - board: nice_nano_v2
    artifact-name: nice_nano-v2
  - board: nice_nano
    shield: settings_reset
    artifact-name: nice_nano-v1-settings-reset
  - board: nice_nano_v2
    shield: settings_reset
    artifact-name: nice_nano-v2-settings-reset
